services:
  - type: web
    name: cryptodatamonitor-backend
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: HEADLESS
        value: "true"
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: "Crypto Data Monitor 24/7 Cloud"
