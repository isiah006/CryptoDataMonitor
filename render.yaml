services:
  - type: web
    name: cryptodatamonitor-backend
    env: node
    region: singapore
    plan: free
    buildCommand: if [ -d "backend" ]; then cd backend; fi && npm install && npx playwright install --with-deps chromium && npm run build
    startCommand: if [ -d "backend" ]; then cd backend; fi && node dist/Server.js
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: HEADLESS
        value: "true"
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: "Crypto Data Monitor 24/7 Cloud"
