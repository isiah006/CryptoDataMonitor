services:
  - type: web
    name: cryptodatamonitor-backend
    env: node
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npx playwright install chromium && npm run build
    startCommand: node dist/Server.js
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: HEADLESS
        value: "true"
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: "Crypto Data Monitor 24/7 Cloud"
